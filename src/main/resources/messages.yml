# ============================================================
#  InMc-Fishing 메시지 설정 파일
#  플러그인이 플레이어에게 보내는 모든 표시 텍스트(채팅/액션바/타이틀)를
#  역할군별로 묶어 관리합니다.
# ============================================================
#  {prefix}   - 아래 prefix 값으로 자동 치환 (formatMessage 사용 시)
#  {item}     - 낚은 아이템 이름
#  {grade}    - 등급 (F/E/D/C/B/A/S)
#  {player}   - 플레이어 이름
#
#  색상 코드: &0~&9, &a~&f, &l(굵게) &n(밑줄) &o(기울임) &m(취소선)
# ============================================================

# 모든 메시지 앞에 자동으로 붙는 접두사
prefix: "&f[ &b낚시&f ]"

# ============================================================
#  [catch] 낚시 성공/획득 메시지
#  {graded_item} = 등급 접두사 포함 물고기 이름 (예: [F] 생대구)
#  {trophy}      = 트로피/레어 트로피 문구 (비트로피면 빈 문자열)
# ============================================================
catch:
  # 낚시 성공 일반 메시지
  caught: "{prefix} 축하합니다! {graded_item}&f를(을) 낚았습니다! {trophy}"
  # 더블 보상 성공 메시지 (아이템 2개)
  caught-double: "{prefix} 축하합니다! {graded_item}&f를(을) 2마리 낚았습니다! {trophy}"
  # 트로피/레어 트로피를 낚았을 때 서버 전체 공지 (피드백)
  trophy-announce: "&6[ 낚시 ] &f{player}&a님이 {graded_item}&a을(를) 낚았습니다! {trophy}"
  # /fishing show 명령어 — 손에 든 물고기를 전체 서버에 자랑하는 공지
  show: "&6[ 낚시 ] &f{player}&7님이 {graded_item}&7을(를) 자랑합니다! {trophy}"
  # 대어(Big Fish) 낚시 성공 메시지
  big-fish: "&b대어를 낚았습니다!"

# ============================================================
#  [fail] 실패/제한 메시지
#  (Trophy Fight 실패 원인별 메시지 포함 — 피드백: "파이트시, 물고기가 도망가는 원인을 나눴으면 좋겠어")
# ============================================================
fail:
  # 미니게임 실패 (일반 L/R 클릭 미니게임 실패 / Trophy Fight 원인 미지정 fallback)
  fail: "&f물고기가 도망갔네.."
  # Tension이 Line Strength에 도달 — 줄이 끊어짐
  tension: "&c줄이 끊겼네.."
  # Reel State가 0에 도달 — 릴이 고장남
  reel-break: "&c릴이 고장났네.."
  # Distance가 Max Distance에 도달 — 줄 길이가 부족함
  distance: "&c줄 길이가 부족하네.."
  # 제한 시간 초과
  timeout: "&c시간이 초과되어 놓쳤네.."
  # 인벤토리가 가득 찼을 때 메시지
  no-empty-slot: "&c인벤토리에 빈칸이 없습니다!"
  # 보상 지급 실패 시 메시지 (관리자 설정 오류 등)
  no-rewards: "{prefix} 아무것도 낚이지 않았네요. 관리자에게 문의하세요. ({grade})"
  # 미등록 낚싯대 사용 시 메시지
  unregistered-rod: "&c등록되지 않은 낚싯대입니다. 관리자에게 문의하세요."

# ============================================================
#  [minigame] 미니게임 ON/OFF 전환 메시지
# ============================================================
minigame:
  on: "{prefix} &a미니게임이 &f켜졌습니다&a. L/R 클릭 미니게임으로 낚습니다."
  off: "{prefix} &e미니게임이 &f꺼졌습니다&e. 입질 후 자동으로 낚습니다."
  toggle-disabled: "&c미니게임 ON/OFF 전환 기능이 비활성화되어 있습니다."

# ============================================================
#  [fatigue] 피로도 관련 메시지
# ============================================================
fatigue:
  # 피로도가 바닥나 자동 낚시(미니게임 OFF)가 강제로 잠겼을 때
  locked: "{prefix} &c피로도가 바닥나 자동 낚시가 잠겼습니다! 미니게임으로만 낚시할 수 있습니다."
  # 피로도가 회복되어 다시 자동 낚시를 사용할 수 있게 됐을 때
  unlocked: "{prefix} &a피로도가 회복되어 다시 자동 낚시를 사용할 수 있습니다."
  # 피로도 회복 물약 사용 ({amount} = 회복량, {current} = 사용 후 현재 피로도)
  potion-used: "{prefix} &b피로도를 {amount} 회복했습니다. (현재: {current})"

# ============================================================
#  [cast-status] 찌를 던졌을 때 액션바 상태 표시
#  {rod} = 인식된 낚싯대 이름, {fatigue} = 현재 피로도
# ============================================================
cast-status:
  ready: "&a물고기를 기다리는 중~ &f{rod}"
  unregistered-rod: "&c등록되지 않은 낚싯대"
  wrong-world: "&c이 월드에서는 낚시 불가"
  plugin-disabled: "&c낚시 플러그인 비활성"
  no-empty-slot: "&c인벤토리 빈칸이 필요합니다"
  minigame-off: "&f자동 낚시 모드 &8| &b피로도 {fatigue}"

# ============================================================
#  [auto-catch] 미니게임 OFF 자동 낚시 중 액션바
#  {time} = 남은 초, {grade} = 등급, {fish} = 물고기 이름, {fatigue} = 현재 피로도
# ============================================================
auto-catch:
  actionbar-format: "&e{time} 초 &7후 낚음... &f[{grade}] &7{fish} &8| &b피로도 {fatigue}"

# ============================================================
#  [titles] 미니게임 타이틀 표시
#  {grade} = 등급, {sequence} = R/L 시퀀스
#  (사용되는 항목만 유지 — 미사용 시작 타이틀/진행바 색상 등은 삭제됨)
# ============================================================
titles:
  # 미니게임 성공 시 타이틀
  success-title: "&f잡았다!"
  # 성공 시 서브타이틀 ({sequence} = 완료된 시퀀스)
  success-subtitle: "&a{sequence}"
  # 미니게임 실패 시 타이틀
  fail-title: "&f물고기가 도망갔네.."
  # 시간 초과로 실패 시 타이틀
  timeout-title: "&f물고기가 도망갔네.."
  # 실패/타임아웃 시 서브타이틀
  fail-subtitle: "&cL : 좌클릭 R : 우클릭"
  # 타이틀 표시 시간 (초)
  title-display-seconds: 2.0
  title-fade-in: 0.5
  title-fade-out: 0.5

# ============================================================
#  [collection] 도감 관련 표시 텍스트
# ============================================================
collection:
  # 도감 정보 해금(Unlock) — 해금되지 않은 정보를 표시할 문자열
  unlock:
    hidden-text: "???"

  # 도감 보상 사유 설명 (피드백) — 보상이 지급될 때 무슨 이유로 받는지 안내
  # {fish} = 물고기 이름, {grade} = 등급(대문자), {milestone} = 마일스톤 수, {size} = 크기
  # 비워두면 기본 문구가 사용됩니다.
  reward-descriptions:
    first-register: "&e[도감] &7'{fish}' 첫 등록 보상을 지급합니다!"
    slot-completion: "&e[도감] &7'{fish}' 슬롯 완성(퍼펙트) 보상을 지급합니다!"
    milestone: "&e[도감] &7'{fish}' {milestone}마리 달성 보상을 지급합니다!"
    grade-all-registered: "&e[도감] &7{grade}등급 전체 등록 보상을 지급합니다!"
    grade-all-perfect: "&e[도감] &7{grade}등급 전체 퍼펙트 보상을 지급합니다!"
    full-completion: "&e[도감] &7도감 전체 완성 보상을 지급합니다!"
    trophy: "&e[도감] &7'{fish}' 트로피 달성 보상을 지급합니다! ({size}cm)"
    rare-trophy: "&e[도감] &7'{fish}' 레어 트로피 달성 보상을 지급합니다! ({size}cm)"
