# ============================================================
#  InMc-Fishing 메시지 설정 파일
#  플러그인이 플레이어에게 보내는 모든 표시 텍스트(채팅/액션바/타이틀)를
#  역할군별로 묶어 관리합니다.
# ============================================================
#  {prefix}   - 아래 prefix 값으로 자동 치환 (formatMessage 사용 시)
#  {item}     - 낚은 아이템 이름
#  {grade}    - 등급 (F/E/D/C/B/A/S)
#  {player}   - 플레이어 이름
#
#  색상 코드: &0~&9, &a~&f, &l(굵게) &n(밑줄) &o(기울임) &m(취소선)
# ============================================================

# 모든 메시지 앞에 자동으로 붙는 접두사
prefix: "&f[ &b낚시&f ]"

# ============================================================
#  [catch] 낚시 성공/획득 메시지
#  {graded_item} = 등급 접두사 포함 물고기 이름 (예: [F] 생대구)
#  {trophy}      = 트로피/레어 트로피 문구 (비트로피면 빈 문자열)
# ============================================================
catch:
  # 낚시 성공 일반 메시지
  caught: "{prefix} 축하합니다! {graded_item}&f를(을) 낚았습니다! {trophy}"
  # 더블 보상 성공 메시지 (아이템 2개)
  caught-double: "{prefix} 축하합니다! {graded_item}&f를(을) 2마리 낚았습니다! {trophy}"
  # 트로피/레어 트로피를 낚았을 때 서버 전체 공지 (피드백)
  trophy-announce: "&6[ 낚시 ] &f{player}&a님이 {graded_item}&a을(를) 낚았습니다! {trophy}"
  # /fishing show 명령어 — 손에 든 물고기를 전체 서버에 자랑하는 공지
  show: "&6[ 낚시 ] &f{player}&7님이 {graded_item}&7을(를) 자랑합니다! {trophy}"
  # 대어(Big Fish) 낚시 성공 메시지
  big-fish: "&b대어를 낚았습니다!"

# ============================================================
#  [fail] 실패/제한 메시지
#  (Trophy Fight 실패 원인별 메시지 포함 — 피드백: "파이트시, 물고기가 도망가는 원인을 나눴으면 좋겠어")
# ============================================================
fail:
  # 미니게임 실패 (일반 L/R 클릭 미니게임 실패 / Trophy Fight 원인 미지정 fallback)
  fail: "&f물고기가 도망갔네.."
  # Tension이 Line Strength에 도달 — 줄이 끊어짐
  tension: "&c줄이 끊겼네.."
  # Reel State가 0에 도달 — 릴이 고장남
  reel-break: "&c릴이 고장났네.."
  # Distance가 Max Distance에 도달 — 줄 길이가 부족함
  distance: "&c줄 길이가 부족하네.."
  # 제한 시간 초과
  timeout: "&c시간이 초과되어 놓쳤네.."
  # 인벤토리가 가득 찼을 때 메시지
  no-empty-slot: "&c인벤토리에 빈칸이 없습니다!"
  # 보상 지급 실패 시 메시지 (관리자 설정 오류 등)
  no-rewards: "{prefix} 아무것도 낚이지 않았네요. 관리자에게 문의하세요. ({grade})"
  # 미등록 낚싯대 사용 시 메시지
  unregistered-rod: "&c등록되지 않은 낚싯대입니다. 관리자에게 문의하세요."

# ============================================================
#  [minigame] 미니게임 ON/OFF 전환 메시지
# ============================================================
minigame:
  on: "{prefix} &a미니게임이 &f켜졌습니다&a. L/R 클릭 미니게임으로 낚습니다."
  off: "{prefix} &e미니게임이 &f꺼졌습니다&e. 입질 후 자동으로 낚습니다."
  toggle-disabled: "&c미니게임 ON/OFF 전환 기능이 비활성화되어 있습니다."

# ============================================================
#  [fatigue] 피로도 관련 메시지
# ============================================================
fatigue:
  # 피로도가 바닥나 자동 낚시(미니게임 OFF)가 강제로 잠겼을 때
  locked: "{prefix} &c피로도가 바닥나 자동 낚시가 잠겼습니다! 미니게임으로만 낚시할 수 있습니다."
  # 피로도가 회복되어 다시 자동 낚시를 사용할 수 있게 됐을 때
  unlocked: "{prefix} &a피로도가 회복되어 다시 자동 낚시를 사용할 수 있습니다."
  # 피로도 회복 물약 사용 ({amount} = 회복량, {current} = 사용 후 현재 피로도)
  potion-used: "{prefix} &b피로도를 {amount} 회복했습니다. (현재: {current})"

# ============================================================
#  [cast-status] 찌를 던졌을 때 액션바 상태 표시
#  {rod} = 인식된 낚싯대 이름, {fatigue} = 현재 피로도
# ============================================================
cast-status:
  ready: "&a물고기를 기다리는 중~ &f{rod}"
  unregistered-rod: "&c등록되지 않은 낚싯대"
  wrong-world: "&c이 월드에서는 낚시 불가"
  # WorldGuard 보호 구역에서 fishing-enabled: false 인 경우 (worldguard.yml)
  region-blocked: "&c이 구역에서는 낚시할 수 없습니다"
  plugin-disabled: "&c낚시 플러그인 비활성"
  no-empty-slot: "&c인벤토리 빈칸이 필요합니다"
  minigame-off: "&f자동 낚시 모드 &8| &b피로도 {fatigue}"

# ============================================================
#  [auto-catch] 미니게임 OFF 자동 낚시 중 액션바
#  {time} = 남은 초, {grade} = 등급, {fish} = 물고기 이름, {fatigue} = 현재 피로도
# ============================================================
auto-catch:
  actionbar-format: "&e{time} 초 &7후 낚음... &f[{grade}] &7{fish} &8| &b피로도 {fatigue}"

# ============================================================
#  [titles] 미니게임 타이틀 표시
#  {grade} = 등급, {sequence} = R/L 시퀀스
#  (사용되는 항목만 유지 — 미사용 시작 타이틀/진행바 색상 등은 삭제됨)
# ============================================================
titles:
  # 미니게임 성공 시 타이틀
  success-title: "&f잡았다!"
  # 성공 시 서브타이틀 ({sequence} = 완료된 시퀀스)
  success-subtitle: "&a{sequence}"
  # 미니게임 실패 시 타이틀
  fail-title: "&f물고기가 도망갔네.."
  # 시간 초과로 실패 시 타이틀
  timeout-title: "&f물고기가 도망갔네.."
  # 실패/타임아웃 시 서브타이틀
  fail-subtitle: "&cL : 좌클릭 R : 우클릭"
  # 타이틀 표시 시간 (초)
  title-display-seconds: 2.0
  title-fade-in: 0.5
  title-fade-out: 0.5

# ============================================================
#  [collection] 도감 관련 표시 텍스트
# ============================================================
collection:
  # 도감 정보 해금(Unlock) — 해금되지 않은 정보를 표시할 문자열
  unlock:
    hidden-text: "???"

  # 도감 보상 사유 설명 — 보상이 지급될 때 무슨 이유로 받는지 안내
  # {fish} = 물고기 이름, {grade} = 등급(대문자), {milestone} = 마일스톤 수, {size} = 크기
  # 비워두면 기본 문구가 사용됩니다.
  reward-descriptions:
    first-register: "&e[도감] &7'{fish}' 첫 등록 보상을 지급합니다!"
    slot-completion: "&e[도감] &7'{fish}' 슬롯 완성(퍼펙트) 보상을 지급합니다!"
    milestone: "&e[도감] &7'{fish}' {milestone}마리 달성 보상을 지급합니다!"
    grade-all-registered: "&e[도감] &7{grade}등급 전체 등록 보상을 지급합니다!"
    grade-all-perfect: "&e[도감] &7{grade}등급 전체 퍼펙트 보상을 지급합니다!"
    full-completion: "&e[도감] &7도감 전체 완성 보상을 지급합니다!"
    trophy: "&e[도감] &7'{fish}' 트로피 달성 보상을 지급합니다! ({size}cm)"
    rare-trophy: "&e[도감] &7'{fish}' 레어 트로피 달성 보상을 지급합니다! ({size}cm)"


# ============================================================
#  [tournament] 낚시 대회 표시 텍스트
#  {name} = 대회 이름, {fee} = 참가비 (금액 그대로)
#  (색상 코드 &e 등 자유롭게 사용, {prefix} 사용 가능)
# ============================================================
tournament:
  # 대회 시작 공지 (참가비 없음)
  start: "&e[ 낚시 대회 ] &f{name}&f이(가) 시작되었습니다! &7사전 신청자는 자동 참여되었습니다."
  # 대회 시작 공지 (참가비 있음)
  start-fee: "&e[ 낚시 대회 ] &f{name}&f이(가) 시작되었습니다! &6(참가비: {fee}) &7사전 신청자는 자동 참여되었습니다."

# ============================================================
#  [command] /fishing 명령어 출력
#  줄 단위로 어드민이 자유롭게 추가·삭제할 수 있도록 리스트로 둡니다.
#  리스트를 통째로 비우면 해당 부분이 출력되지 않습니다.
# ============================================================
command:
  help:
    header:
      - "&b&m                                                &r"
      - "&b[InMc-Fishing] &f사용 가능한 명령어"
    lines:
      - "&e/fishing collection &7(&e/fishing 도감&7) &f- 도감 GUI를 엽니다. 낚은 물고기를 등록하고 보상을 받을 수 있습니다."
      - "&e/fishing rank &7(&e/fishing 랭킹&7) &f- 랭킹 GUI를 엽니다."
      - "&e/fishing net &7(&e/fishing 어망&7) &f- 어망 GUI를 엽니다. 낚은 물고기를 보관/정렬/꺼낼 수 있습니다."
      - "&e/fishing tournament &7- 대회 목록 확인, 참가/퇴장, 순위 확인 등을 합니다. (하위 명령어: list, join, leave, gui, wins)"
      - "&e/fishing list [등급] &7- 등급별 물고기 목록을 확인합니다."
      - "&e/fishing info &7- 플러그인 정보(등급/물고기/낚싯대 개수 등)를 확인합니다."
      - "&e/fishing minigame <on|off> &7- 개인 L/R 클릭 미니게임을 켜거나 끕니다."
      - "&e/fishing fatigue &7- 내 자동 낚시 피로도를 확인합니다."
      - "&e/fishing show &7- 손에 든 물고기를 서버 전체에 자랑합니다."
      - "&e/fishing fillet &7(&e/fishing 필렛&7) &f- 생선 살 가공 GUI를 엽니다."
    # infishing.admin 권한이 있을 때만 추가로 출력됩니다.
    admin-lines:
      - "&c&l[관리자 전용]"
      - "&e/fishing reload &7- config/도감/대회 등 설정 파일을 다시 불러옵니다. (등급·물고기·낚싯대 Registry는 미포함)"
      - "&e/fishing debug &7- 등급/물고기/낚싯대 로드 현황을 확인합니다."
      - "&e/fishing simulate <횟수> [등급] &7- 등급/보상 확률을 대량 시뮬레이션하여 검증합니다."
      - "&e/fishing give <플레이어> <net|fish|trophy|potion|rod|bait|fillet> ... &7- 플레이어에게 물고기/트로피/피로회복 물약/낚싯대/미끼/생선살을 지급합니다."
      - "&e/fishing fatigue <add|set> <플레이어> <수치> &7- 플레이어의 피로도를 증감/설정합니다."
      - "&e/fishing testfightmode <on|off|toggle|status> &7- 기본 L/R 미니게임을 끄고, 잡는 물고기를 트로피 파이트로 바로 진입시킵니다. (테스트용)"
      - "&e/fishing fillet setSlots <플레이어> <set|add> <30> &7- 플레이어의 생선 살 가공 슬롯 수를 설정/증가합니다."
    footer:
      - "&b&m                                                &r"

  # --- 공통 ---
  no-permission: "&c권한이 없습니다."
  player-only: "&c플레이어만 사용할 수 있습니다."
  player-not-found: "&c플레이어를 찾을 수 없습니다: {player}"
  unknown-command: "&e[InMc-Fishing] &7알 수 없는 명령어: {input}"
  unknown-grade: "&c존재하지 않는 등급입니다: {grade}"
  unknown-fish-id: "&c존재하지 않는 물고기 ID입니다: {id}"
  unknown-trophy-fish-id: "&c존재하지 않거나 사이즈 정보가 없는 물고기 ID입니다: {id}"
  unknown-rod-id: "&c존재하지 않는 낚싯대 ID입니다: {id}"
  unknown-bait-id: "&c존재하지 않는 미끼 ID입니다: {id}"
  amount-not-number: "&c개수는 숫자여야 합니다."
  amount-too-large: "&c개수는 최대 {max}까지 지정할 수 있습니다."
  amount-must-be-positive: "&cadd 모드는 1 이상의 양수만 가능합니다."
  net-disabled: "&c어망 시스템이 비활성화되어 있습니다."
  collection-disabled: "&c도감 시스템이 비활성화되어 있습니다."
  ranking-disabled: "&c랭킹 시스템이 비활성화되어 있습니다."
  fillet-unavailable: "&c생선 살 가공 시스템이 초기화되지 않았습니다."
  fatigue-unavailable: "&c피로도 시스템이 초기화되지 않았습니다."
  fight-unavailable: "&cTrophy Fight 시스템이 초기화되지 않았습니다."
  fight-disabled: "&cfight.yml의 trophy-fight.enabled가 false라 파이트를 시작할 수 없습니다."

  # --- 사용법 ---
  usage:
    simulate: "&c사용법: /fishing simulate <횟수>"
    minigame: "&e사용법: /fishing minigame <on|off|toggle|status>"
    testfight: "&c사용법: /fishing testfight <grade> <trophy|rare>"
    testfightmode: "&e사용법: /fishing testfightmode <on|off|toggle|status>"
    fillet-setslots: "&c사용법: /fishing fillet setSlots <플레이어> <set|add> <수>"
    fatigue-modify: "&c사용법: /fishing fatigue {mode} <플레이어> <수치>"
    tournament: "&e[InMc-Fishing] &7사용법: /fishing tournament <list|join|leave|gui|start|stop> [id]"
    tournament-join: "&c사용법: /fishing tournament join <대회ID>"
    tournament-leave: "&c사용법: /fishing tournament leave <대회ID>"
    tournament-start: "&c사용법: /fishing tournament start <대회ID>"
    tournament-stop: "&c사용법: /fishing tournament stop <대회ID>"
    give: "&c사용법: /fishing give <net|fish|trophy|potion|rod|bait|fillet> <플레이어> ..."
    give-potion: "&c사용법: /fishing give potion <플레이어> <등급> [개수]"
    give-net: "&c사용법: /fishing give net <플레이어> <물고기ID> [개수]"
    give-fish: "&c사용법: /fishing give fish <플레이어> <물고기ID> [개수]"
    give-trophy: "&c사용법: /fishing give trophy <플레이어> <물고기ID> [개수]"
    give-rod: "&c사용법: /fishing give rod <플레이어> <낚싯대ID> [개수]"
    give-bait: "&c사용법: /fishing give bait <플레이어> <baitId> [개수]"
    give-fillet: "&c사용법: /fishing give fillet <플레이어> <등급(f~s)> <normal|trophy|rare> [개수]"

  # --- /fishing reload ---
  reload:
    success: "&a[InMc-Fishing] 설정이 리로드되었습니다."
    failed: "&c[InMc-Fishing] 리로드 중 오류 발생: {error}"

  # --- /fishing debug ---
  debug:
    header: "&6===== InMc-Fishing Debug ====="
    grades: "&e등급: &f{count}개"
    fish: "&e물고기: &f{count}개"
    rods: "&e낚싯대: &f{count}개"
    sessions: "&e활성 세션: &f{count}"
    config-enabled: "&e설정 리로드 가능: &f{value}"
    allowed-worlds: "&e허용 월드: &f{value}"
    # {name} = Vault / MMOItems / PlaceholderAPI / WorldGuard
    hook: "&e{name}: &f{value}"
    collection: "&e도감: &f{value} (캐시 {cached}명)"
    ranking: "&e랭킹: &f{value}"
    tournament: "&e대회: &f{registered}개 등록, {running}개 진행 중"
    footer: "&6=============================="
    enabled: "활성화"
    disabled: "비활성화"

  # --- /fishing simulate ---
  simulate:
    count-not-number: "&c횟수는 숫자여야 합니다: {input}"
    count-range: "&c횟수는 1~10,000,000 사이여야 합니다."
    running: "&e[InMc-Fishing] &7{count}회 시뮬레이션 중..."
    header: "&6===== 시뮬레이션 결과 ({count}회) ====="
    total: "&e총 성공: &f{count}"
    big-fish: "&e대어: &f{count} ({percent}%)"
    double: "&e더블: &f{count} ({percent}%)"
    grade-header: "&6--- 등급별 확률 ---"
    grade-line: "&e{name}: &f{count} ({percent}%)"
    item-header: "&6--- 아이템별 비율 ---"
    item-line: "&7{name}: &f{count} ({percent}%)"

  # --- /fishing dumpbalance (개발용) ---
