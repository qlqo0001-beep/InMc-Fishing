# ============================================================
#  등급(Grade) 설정 파일
#  낚시 시스템의 등급별 확률과 난이도를 설정합니다.
# ============================================================
#
# 각 등급은 다음 속성을 가집니다:
#
#   id:                   등급 식별자 (내부용, 반드시 소문자 f/e/d/c/b/a/s)
#   weight:               등급 가중치 (높을수록 자주 낚입니다)
#                         모든 등급의 weight 합계 = 100이 되도록 조절하세요
#   input-count:          미니게임 성공에 필요한 클릭 횟수
#   time-seconds:         미니게임 제한 시간 (초, 소수점 가능)
#   next-grade:           대어(Big Fish) 당첨 시 승급될 등급
#                         S등급은 다음 등급이 없으므로 이 필드를 생략합니다
#   color:                등급 표시용 색상 코드 (예: &f 흰색, &a 초록)
#
# 사용 예시:
#   weight를 높이면 → 해당 등급이 더 자주 나옴
#   input-count를 높이면 → 더 어려워짐 (클릭을 많이 해야 함)
#   time-seconds를 낮추면 → 더 어려워짐 (빨리 클릭해야 함)
# ============================================================
grades:
  F:
    # F등급 — 가장 낮은 등급, 가장 자주 나옴
    id: "f"
    weight: 45       # 45% 확률로 F등급이 선택됨
    input-count: 3   # 3번 클릭해야 성공
    time-seconds: 5.0 # 5초 안에 클릭 완료
    next-grade: "e"  # 대어 당첨 시 E등급으로 승급
    color: "&f"      # 흰색

  E:
    id: "e"
    weight: 25
    input-count: 4
    time-seconds: 4.5
    next-grade: "d"
    color: "&a"      # 초록

  D:
    id: "d"
    weight: 15
    input-count: 5
    time-seconds: 4.0
    next-grade: "c"
    color: "&b"      # 파랑

  C:
    id: "c"
    weight: 8
    input-count: 6
    time-seconds: 3.8
    next-grade: "b"
    color: "&d"      # 별

  B:
    id: "b"
    weight: 4
    input-count: 7
    time-seconds: 3.5
    next-grade: "a"
    color: "&e"      # 금

  A:
    id: "a"
    weight: 2
    input-count: 8
    time-seconds: 3.2
    next-grade: "s"
    color: "&c"      # 빨강

  S:
    # S등급 — 가장 높은 등급, 가장 드물게 나옴
    # 다음 등급이 없으므로(S가 최상위) 대어 승급이 발생하지 않음
    id: "s"
    weight: 1        # 1% 확률
    input-count: 9   # 9번 클릭해야 성공 (가장 어려움)
    time-seconds: 3.0 # 3초 안에 클릭 완료 (가장 짧음)
    # next-grade: 생략 (S등급은 대어 승급 없음)
    color: "&4"      # 어두운 빨강
