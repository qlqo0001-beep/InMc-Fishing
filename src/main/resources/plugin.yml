name: InMc-Fishing
version: '1.5.1'
main: me.ninesik.fishing.InMcFishing
description: Java 25 / Paper 26.2 기반 낚시 플러그인 (등급별 미니게임, 도감, 대회)
author: NineSik
api-version: '1.21'
aliases: [IF]

softdepend: [MMOItems, PlaceholderAPI, Vault, WorldGuard]

# Paper 라이브러리 로더가 서버 기동 시 Maven Central에서 내려받아 격리 로드한다.
# (shadowJar는 org.bstats만 병합하므로 이 드라이버는 jar에 포함되지 않는다.
#  서버 최초 기동 시 인터넷 연결이 필요하며, 이후에는 캐시된 것을 사용한다.)
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0

commands:
  fishing:
    description: InMc-Fishing 관리자/유저 명령어
    usage: /<command> [reload|debug|simulate|info|collection|rank|tournament|give|list|...]
    aliases: [if, 낚시]

permissions:
  infishing.user:
    description: InMc-Fishing 일반 유저 명령어 권한
    default: true
  infishing.admin:
    description: InMc-Fishing 관리자 명령어 권한
    default: op
    children:
      infishing.user: true
