# ============================================================
#  InMc-Fishing 피로도(Fatigue) 시스템 설정 파일
#  자동 낚시(미니게임 OFF) 전용 피로도 시스템입니다.
#  일반 L/R 클릭 미니게임 낚시에는 전혀 영향을 주지 않습니다.
#  장시간(예: 밤새) 방치성 자동 낚시를 제한하기 위한 설정입니다.
# ============================================================
#  역할군별 그룹: 기본/상한/회복 / 잠금 임계값 / 등급별 소모량
#  (피로회복 물약 정의는 items/potions.yml 로 이동 — 아이템 정의)
# ============================================================
fatigue:
  # --- 기본/상한 ---
  # 플레이어의 기본 최대 피로도. 자연 회복은 기본적으로 이 수치까지만 회복됩니다.
  # (낚싯대 옵션으로 최대 피로도가 증가하면 증가된 수치까지 자연 회복됩니다.)
  default: 2000

  # 플레이어가 가질 수 있는 절대 최대 피로도.
  # 자연 회복으로는 도달할 수 없으며, 피로도 회복 물약/관리자 명령어 등 수동 회복만 이 수치까지 회복 가능.
  max: 20000

  # --- 자연 회복 ---
  recovery:
    # 회복 주기(interval)마다 자동으로 회복되는 기본 피로도량
    amount: 100
    # 자연 회복 주기(초). 기본값 300 = 5분마다 회복됩니다.
    interval: 300

  # --- 잠금 임계값 ---
  # 피로도가 이 값 "이하"로 내려가면 미니게임이 자동으로 강제 ON되고,
  # 플레이어는 /fishing minigame off 로 다시 끌 수 없습니다 (자동 낚시 잠금).
  auto-minigame-lock-threshold: 0

  # 잠긴 상태에서 피로도가 이 값 "이상"으로 회복되면 다시 미니게임 OFF(자동 낚시)가 가능해집니다.
  auto-minigame-unlock-threshold: 100

  # --- 등급별 소모량 ---
  # 자동 낚시(미니게임 OFF) 성공 시 낚은 물고기 등급에 따라 차감되는 피로도량.
  # 일반 미니게임(ON) 낚시에는 적용되지 않습니다.
  consume:
    f: 10
    e: 50
    d: 100
    c: 200
    b: 400
    a: 800
    s: 1600
