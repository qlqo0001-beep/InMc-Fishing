# ============================================================
#  B등급 아이템 목록
#  상위 등급, 희귀한 아이템이 낚입니다.
#  더블 보상이 제한되는 아이템이 많습니다.
# ============================================================
#
# [grade-settings 속성 설명]
#   input-count:    미니게임 성공에 필요한 클릭 횟수
#   time-seconds:   미니게임 제한 시간 (초, 소수점 가능)
#   weight:         등급 가중치 (grades.yml의 weight와 동일)
#
# [items 속성 설명]
#   id:             아이템 식별자 (내부용, 중복 불가)
#   use-type:       vanilla (바닐라 아이템) 또는 mmoitems (MMOItems 아이템)
#
#   [use-type: vanilla 전용]
#   vanilla-material: 바닐라 아이템 종류 (Material 이름)
#   vanilla-name:     아이템에 표시될 이름 (& 색상코드 사용 가능)
#   vanilla-lore:     아이템 설명 (& 색상코드 사용 가능, 여러 줄 가능)
#
#   [use-type: mmoitems 전용]
#   mmoitems-type:    MMOItems 아이템 타입
#   mmoitems-id:      MMOItems 아이템 ID
#
#   weight:           아이템 가중치 (높을수록 자주 나옴)
#   double-enabled:   true = 더블 보상 가능 (2개 지급)
#                     false = 더블 보상 불가능 (항상 1개)
#   commands:         낚시 성공 시 실행될 콘솔 명령어 목록
#                     {player} - 플레이어 이름으로 치환
# ============================================================
grade-settings:
  input-count: 7    # 7번 클릭해야 성공
  time-seconds: 3.5 # 3.5초 안에 클릭 완료
  weight: 4         # 4% 확률로 B등급이 선택됨

items:
  # 네더의 별 — B등급에서 가장 자주 낚이는 희귀 아이템 (더블 불가)
  nether_star:
    id: "nether_star"
    use-type: vanilla
    vanilla-material: NETHER_STAR
    vanilla-name: "&b네더의 별"
    vanilla-lore:
      - "&7신비로운 네더의 별입니다."
    weight: 40
    double-enabled: false # 더블 보상 불가 (너무 귀함)
    commands: []

  # 신호기 — B등급에서 중간 확률로 낚이는 아이템 (더블 불가)
  beacon:
    id: "beacon"
    use-type: vanilla
    vanilla-material: BEACON
    vanilla-name: "&6신호기"
    vanilla-lore:
      - "&7강력한 빛을 발하는 신호기입니다."
    weight: 35
    double-enabled: false
    commands: []

  # 고급 다이아몬드 블록 — B등급에서 드물게 낚이는 블록 (더블 가능)
  diamond_block:
    id: "diamond_block_rare"
    use-type: vanilla
    vanilla-material: DIAMOND_BLOCK
    vanilla-name: "&b고급 다이아몬드 블록"
    vanilla-lore:
      - "&7특별한 다이아몬드 블록입니다."
    weight: 25
    double-enabled: true
    commands: []