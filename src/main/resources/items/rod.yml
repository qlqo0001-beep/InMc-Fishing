# ============================================================
#  낚싯대(Rod) 설정 파일
#  플러그인에서 인식하는 낚싯대의 종류와 보너스 설정
# ============================================================
#
# 각 낚싯대는 고유 ID로 식별됩니다. 모든 낚싯대는 바닐라(vanilla) 타입이며,
# 이름(vanilla-name)이 정확히 일치하는 FISHING_ROD를 들고 있으면 해당 설정이 적용됩니다.
# (& 색상코드는 자동 변환됩니다: &a = 초록)
#
# [use-type 종류]
#   vanilla   - 바닐라 FISHING_ROD에 커스텀 이름/로어를 붙여 사용 (기본)
#
# [속성 설명]
#   id:                   낚싯대 식별자 (내부용)
#   use-type:             vanilla
#   vanilla-material:     아이템 종류 (보통 FISHING_ROD)
#   vanilla-name:         아이템에 표시될 이름 (& 색상코드 사용 가능) — 낚싯대 인식 기준
#   vanilla-lore:         아이템 설명 (& 색상코드 사용 가능, 여러 줄 가능)
#
#   bonus:                등급별 추가 가중치 (음수 = 감소)
#     F: 5    → F등급이 나올 확률에 +5 추가
#     E: 2    → E등급이 나올 확률에 +2 추가
#   double-chance-bonus:  더블 보너스 확률 추가 (%)
#   big-fish-chance-bonus: 대어 확률 추가 (%)
#
#   options:              낚싯대 옵션 (없으면 0/보너스 없음, 모두 선택 사항)
#     max-fatigue:        이 낚싯대를 들고 있는 동안 최대 피로도를 이 값만큼 늘려준다
#                         (기본 최대 피로도 + 이 값, config 절대 상한은 넘지 못함)
#     fatigue-recovery:   이 낚싯대를 들고 있는 동안 자연 회복 1회당 고정값을 추가로 회복
#                         (기본 회복 200 + 이 값 50 = 250)
#     reel-power:         트로피 파이트: 기본(30) + 이 값 으로 릴 파워가 결정된다 (추가값).
#                         높을수록 물고기 체력(Stamina)을 빠르게 지치게 만듦
#     line-strength:      트로피 파이트: 기본(100) + 이 값 으로 낚싯줄 최대 장력(Tension)이 결정 (추가값)
#     reel-durability:    트로피 파이트: 기본(30) + 이 값 으로 릴 내구도가 결정 (추가값).
#                         높을수록 릴 상태(Reel State)가 느리게 감소
#
# 밸런스 기준: 기본(보너스 0) 낚싯대로 D등급은 어려움, E등급은 노력하면 가능, F는 쉬움.
# 아래 10종은 1번(≈기본) → 10번(최상위) 순으로 상위 등급 확률·Fight 성능·피로도가 강해지는 사다리.
# ============================================================
rods:

