# ============================================================
#  낚싯대(Rod) 설정 파일
#  플러그인에서 인식하는 낚싯대의 종류와 보너스 설정
# ============================================================
#
# 각 낚싯대는 고유 ID로 식별됩니다.
#
# [use-type 종류]
#   mmoitems  - MMOItems 플러그인의 아이템을 낚싯대로 사용
#   vanilla   - 바닐라 FISHING_ROD에 커스텀 이름/로어를 붙여 사용
#
# [속성 설명]
#   id:                   낚싯대 식별자 (내부용)
#   use-type:             mmoitems 또는 vanilla
#
#   [use-type: mmoitems 전용]
#   mmoitems-type:        MMOItems 아이템 타입 (보통 "rod")
#   mmoitems-id:          MMOItems 아이템 ID
#
#   [use-type: vanilla 전용]
#   vanilla-material:     아이템 종류 (보통 FISHING_ROD)
#   vanilla-name:         아이템에 표시될 이름 (& 색상코드 사용 가능)
#   vanilla-lore:         아이템 설명 (& 색상코드 사용 가능, 여러 줄 가능)
#
#   bonus:                등급별 추가 가중치
#     F: 5    → F등급이 나올 확률에 +5 추가
#     E: 2    → E등급이 나올 확률에 +2 추가
#     (음수도 가능: -5면 5 감소)
#   double-chance-bonus:  더블 보너스 확률 추가 (%)
#   big-fish-chance-bonus: 대어 확률 추가 (%)
#
#   options:              피로도 시스템 및 Trophy Fight 관련 낚싯대 옵션 (없으면 보너스 없음, 모두 선택 사항)
#     max-fatigue:        이 낚싯대를 손에 들고 있는 동안 최대 피로도를 이 값만큼 늘려준다
#                         (config.yml fatigue.max 절대 상한은 넘지 못함)
#     fatigue-recovery:   이 낚싯대를 손에 들고 있는 동안 자연 회복 1회당 고정 수치를 추가로 회복시켜준다
#                         (퍼센트가 아닌 고정값. 예: 기본 회복 200 + 이 값 50 = 250)
#     reel-power:         Trophy Fight에서 릴이 물고기 체력(Stamina)을 소모시키는 효율
#                         (높을수록 물고기를 빠르게 지치게 만듦)
#     line-strength:      Trophy Fight에서 낚싯줄이 버틸 수 있는 최대 장력(Tension)
#                         (높을수록 강한 돌진에도 줄이 끊어지지 않음)
#     reel-durability:    Trophy Fight에서 릴의 내구도
#                         (높을수록 릴 상태(Reel State)가 느리게 감소함)
# ============================================================
rods:
  # --- MMOItems 낚싯대 예시 ---
  # MMOItems가 설치된 서버에서 사용합니다.
  # MMOItems에서 "beginner_fishing_rod"라는 ID의 ROD 타입 아이템이
  # 등록되어 있어야 정상 작동합니다.
  beginner_rod:
    id: "beginner_rod"
    use-type: mmoitems
    mmoitems-type: "rod"
    mmoitems-id: "beginner_fishing_rod"
    bonus:
      F: 5      # F등급 확률 +5%
      E: 2      # E등급 확률 +2%
      D: 0
      C: 0
      B: 0
      A: 0
      S: 0
    double-chance-bonus: 0.0   # 더블 확률 추가 없음
    big-fish-chance-bonus: 0.0 # 대어 확률 추가 없음

  # --- 바닐라 낚싯대 예시 (이름 기반) ---
  # 이름이 "고급 낚싯대"인 FISHING_ROD를 들고 있으면 이 설정이 적용됩니다.
  # 낚싯대의 실제 이름이 vanilla-name과 정확히 일치해야 합니다.
  # (& 색상코드는 자동 변환됩니다: &a = 초록)
  advanced_rod:
    id: "advanced_rod"
    use-type: vanilla
    vanilla-material: FISHING_ROD
    vanilla-name: "&a고급 낚싯대"
    vanilla-lore:
      - "&7고급 낚싯대입니다."
      - "&7더 좋은 물고기를 낚을 수 있습니다."
    bonus:
      F: 0
      E: 5      # E등급 확률 +5%
      D: 3      # D등급 확률 +3%
      C: 0
      B: 0
      A: 0
      S: 0
    double-chance-bonus: 0.0
    big-fish-chance-bonus: 0.0

  # --- 상위 낚싯대 ---
  # 하위 등급(F, E)은 확률을 감소(-)시키고
  # 상위 등급(C, B, A, S)은 확률을 증가(+)시킵니다.
  master_rod:
    id: "master_rod"
    use-type: vanilla
    vanilla-material: FISHING_ROD
    vanilla-name: "&6마스터 낚싯대"
    vanilla-lore:
      - "&7최고급 낚싯대입니다."
      - "&7희귀한 물고기를 낚을 확률이 높습니다."
    bonus:
      F: -5     # F등급 확률 -5%
      E: -3     # E등급 확률 -3%
      D: 0
      C: 3      # C등급 확률 +3%
      B: 5      # B등급 확률 +5%
      A: 5      # A등급 확률 +5%
      S: 3      # S등급 확률 +3%
    double-chance-bonus: 2.0   # 더블 확률 +2%
    big-fish-chance-bonus: 1.0  # 대어 확률 +1%
    options:
      max-fatigue: 500        # 이 낚싯대를 들고 있으면 최대 피로도 +500
      fatigue-recovery: 50    # 이 낚싯대를 들고 있으면 자연 회복량 +50 (고정 수치)
      reel-power: 10.0        # Trophy Fight: Stamina 소모 효율 +10
      line-strength: 20.0     # Trophy Fight: 최대 장력 +20
      reel-durability: 15.0   # Trophy Fight: 릴 내구도 +15
