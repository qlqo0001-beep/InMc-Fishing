# ============================================================
#  A등급 아이템 목록
#  최상위 등급, 전설의 아이템이 낚입니다.
#  더블 보상이 불가능하며, 모든 아이템이 매우 희귀합니다.
# ============================================================
#
# [grade-settings 속성 설명]
#   input-count:    미니게임 성공에 필요한 클릭 횟수
#   time-seconds:   미니게임 제한 시간 (초, 소수점 가능)
#   weight:         등급 가중치 (grades.yml의 weight와 동일)
#
# [items 속성 설명]
#   id:             아이템 식별자 (내부용, 중복 불가)
#   use-type:       vanilla (바닐라 아이템) 또는 mmoitems (MMOItems 아이템)
#
#   [use-type: vanilla 전용]
#   vanilla-material: 바닐라 아이템 종류 (Material 이름)
#   vanilla-name:     아이템에 표시될 이름 (& 색상코드 사용 가능)
#   vanilla-lore:     아이템 설명 (& 색상코드 사용 가능, 여러 줄 가능)
#
#   [use-type: mmoitems 전용]
#   mmoitems-type:    MMOItems 아이템 타입
#   mmoitems-id:      MMOItems 아이템 ID
#
#   weight:           아이템 가중치 (높을수록 자주 나옴)
#   double-enabled:   true = 더블 보상 가능 (2개 지급)
#                     false = 더블 보상 불가능 (항상 1개)
#   commands:         낚시 성공 시 실행될 콘솔 명령어 목록
#                     {player} - 플레이어 이름으로 치환
# ============================================================
grade-settings:
  input-count: 8    # 8번 클릭해야 성공
  time-seconds: 3.2 # 3.2초 안에 클릭 완료
  weight: 2         # 2% 확률로 A등급이 선택됨

items:
  # 드래곤 알 — A등급에서 가장 희귀한 전설의 아이템 (더블 불가)
  dragon_egg:
    id: "dragon_egg"
    use-type: vanilla
    vanilla-material: DRAGON_EGG
    vanilla-name: "&c드래곤 알"
    vanilla-lore:
      - "&7전설의 드래곤 알입니다."
      - "&7매우 희귀합니다."
    weight: 30
    double-enabled: false
    commands: []

  # 고급 네더의 별 — A등급의 특별한 네더의 별 (더블 불가)
  nether_star:
    id: "nether_star_rare"
    use-type: vanilla
    vanilla-material: NETHER_STAR
    vanilla-name: "&b고급 네더의 별"
    vanilla-lore:
      - "&7특별한 힘이 깃든 별입니다."
    weight: 35
    double-enabled: false
    commands: []

  # 고급 신호기 — A등급의 강력한 신호기 (더블 불가)
  beacon:
    id: "beacon_rare"
    use-type: vanilla
    vanilla-material: BEACON
    vanilla-name: "&6고급 신호기"
    vanilla-lore:
      - "&7강력한 힘을 발휘하는 신호기입니다."
    weight: 35
    double-enabled: false
    commands: []