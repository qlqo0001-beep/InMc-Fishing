# ============================================
# InMc-Fishing 도감(Collection) 설정
# ============================================

settings:
  # 도감 기능 활성화 여부
  enabled: true

  # 물고기별 최대 등록 슬롯 수 (기본값)
  # items/*.yml에서 개별로 max-slots를 설정하면 그 값이 우선한다.
  default-max-slots: 10

  # INACTIVE(삭제된) 상태 물고기를 도감 GUI에 표시할지 여부
  show-inactive-fish: true

  # 보상 자동 수령 활성화 여부
  # true: 조건 달성 시 즉시 인벤토리로 지급 (꽉 차면 대기)
  # false: 플레이어가 전체수령 버튼을 눌러야 지급
  auto-claim-rewards: true

  # 인벤토리가 꽉 차서 보상을 받지 못할 때 최대 대기 시간 (초)
  # 0이면 무제한 대기, 양수면 해당 시간이 지나면 보상을 포기 처리한다.
  reward-pending-timeout: 0

  # 도감에 물고기를 등록(좌클릭)했을 때 나는 소리
  register-sound: entity.player.levelup

# ============================================
# 도감 보상 설정
# ============================================
rewards:
  # 1. 최초 등록 보상: 물고기를 도감에 처음 등록했을 때 지급 (1회)
  first-register:
    # 예시:
    # cod:
    #   - "give {player} exp 10"
    #   - "give {player} bread 1"

  # 2. 마일스톤 보상: 물고기별 특정 등록 개수 달성 시 지급
  milestones:
    # 예시:
    # cod:
    #   5:
    #     - "give {player} exp 50"

  # 3. 슬롯 완료(퍼펙트) 보상: 해당 물고기의 최대 슬롯을 전부 채웠을 때 1회 지급
  # (등록 개수와 무관하게 물고기별로 정확히 1번만 지급되며, 이후 회수 후 다시 채워도 재지급되지 않는다)
  slot-completion:
    # 예시:
    # cod:
    #   - "give {player} exp 100"
    #   - "give {player} diamond 1"
    #   - "broadcast {player}님이 생대구 도감을 퍼펙트 완성했습니다!"

  # 4. 등급 올등록 보상: 해당 등급의 모든 물고기를 1개 이상 등록했을 때 지급
  grade-all-registered:
    F:
      - "give {player} exp 500"
      - "broadcast {player}님이 F등급 도감을 올등록했습니다!"
    E:
      - "give {player} exp 1000"
    D:
      - "give {player} exp 3000"
    C:
      - "give {player} exp 10000"
    B:
      - "give {player} exp 50000"
    A:
      - "give {player} exp 100000"
    S:
      - "give {player} exp 500000"
      - "broadcast {player}님이 S등급 도감을 올등록했습니다!"

  # 5. 등급 퍼펙트 보상: 해당 등급의 모든 물고기를 최대 슬롯까지 등록했을 때 지급
  grade-all-perfect:
    F:
      - "give {player} exp 5000"
      - "give {player} diamond 10"
      - "broadcast {player}님이 F등급 도감을 퍼펙트 완성했습니다!"
    E:
      - "give {player} exp 10000"
      - "give {player} diamond 20"
    D:
      - "give {player} exp 30000"
      - "give {player} diamond 50"
    C:
      - "give {player} exp 100000"
      - "give {player} nether_star 1"
    B:
      - "give {player} exp 500000"
      - "give {player} beacon 1"
    A:
      - "give {player} exp 1000000"
      - "give {player} command_block 1"
    S:
      - "give {player} exp 5000000"
      - "give {player} dragon_egg 1"
      - "broadcast {player}님이 S등급 도감을 퍼펙트 완성했습니다!"

  # 6. 전체 완성 보상: 모든 물고기를 퍼펙트로 등록했을 때 지급
  full-completion:
    - "give {player} exp 10000000"
    - "give {player} nether_star 10"
    - "give {player} dragon_egg 1"
    - "broadcast {player}님이 낚시 도감을 완전히 완성했습니다!"

# ============================================
# 도감 정보 해금(Unlock) 설정
# 도감 진행도(등록 슬롯 수)에 따라 정보를 단계적으로 공개합니다.
# 해금되지 않은 정보는 hidden-text로 표시됩니다.
# ============================================
unlock:
  # 해금되지 않은 정보를 표시할 문자열
  hidden-text: "???"

  # 해금 단계 설정
  # 각 단계는 required-registrations(필요 등록 슬롯 수)와
  # reveal(공개할 정보 목록)로 구성됩니다.
  # reveal에 사용 가능한 키:
  #   first-caught      - 내가 처음 잡은 날짜
  #   largest-size      - 내가 잡은 최대 크기
  #   smallest-size     - 내가 잡은 최소 크기
  #   trophy-size       - 최소 Trophy 크기
  #   rare-trophy-size  - 최소 Rare Trophy 크기
  #   spawn-chance      - 등장 확률
  #   total-caught      - 총 낚은 횟수
  #   inventory-amount  - 인벤토리 보유량
  #   net-amount        - 어망 보유량
  #   trophy-count      - 일반 Trophy 획득 횟수
  #   rare-trophy-count - Rare Trophy 획득 횟수
  #
  # 새로운 정보를 추가하려면 reveal 목록에 새 키를 추가하기만 하면 됩니다.
  # (코드 수정 없이 Config만으로 설정 가능)
  tiers:
    # 1마리 등록 시 공개
    - required-registrations: 1
      reveal:
        - first-caught
        - largest-size

    # 5마리 등록 시 추가 공개
    - required-registrations: 5
      reveal:
        - trophy-size

    # 7마리 등록 시 추가 공개
    - required-registrations: 7
      reveal:
        - rare-trophy-size

    # 10마리 등록 시 추가 공개
    - required-registrations: 10
      reveal:
        - spawn-chance

# ============================================
# 랭킹(Ranking) 설정
# ============================================
rankings:
  # 랭킹 기능 활성화 여부
  enabled: true

  # 랭킹 업데이트 방식
  # - "periodic": 주기적으로 전체 랭킹을 재계산
  # - "realtime":  이벤트 발생 시 큐에 넣어 실시간 처리
  update-mode: "periodic"

  # periodic 모드에서의 업데이트 주기 (초)
  # 기준: 100명 서버 = 300초(5분)
  # 참고 주석 (인원수에 따른 추천값):
  #   50명  서버 → 150초 (2분 30초)
  #   100명 서버 → 300초 (5분)     ← 기본값
  #   200명 서버 → 600초 (10분)
  #   500명 서버 → 900초 (15분)
  update-interval-seconds: 300

  # realtime 모드에서 한 번에 처리할 큐 항목 수
  # 기준: 100명 서버 = 10개
  queue-batch-size: 10

  # 랭킹 GUI/명령어에서 표시할 상위 인원 수
  display-count: 10

# ============================================
# 트로피(Trophy) 설정
# ============================================
trophies:
  # 트로피 기능 활성화 여부
  enabled: true

  # 일반 트로피 기준: avg-size × multiplier 이상 낚을 시 획득
  trophy-threshold: 1.45

  # 레어 트로피 기준: max-size × multiplier 이상 낚을 시 획득
  rare-trophy-threshold: 0.95

  # 보상 (물고기별 1회만 지급)
  rewards:
    trophy:
      - "give {player} gold_ingot 5"
    rare-trophy:
      - "give {player} diamond 3"
      - "broadcast {player}님이 {fish} 레어 트로피를 달성했습니다! ({size}cm)"
