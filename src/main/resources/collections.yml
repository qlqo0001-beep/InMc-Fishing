# ============================================
# InMc-Fishing 도감(Collection) 설정
# ============================================

settings:
  # 도감 기능 활성화 여부
  enabled: true

  # 물고기별 최대 등록 슬롯 수 (기본값)
  # items/*.yml에서 개별로 max-slots를 설정하면 그 값이 우선한다.
  default-max-slots: 10

  # INACTIVE(삭제된) 상태 물고기를 도감 GUI에 표시할지 여부
  show-inactive-fish: true

  # 보상 자동 수령 활성화 여부
  # true: 조건 달성 시 즉시 인벤토리로 지급 (꽉 차면 대기)
  # false: 플레이어가 전체수령 버튼을 눌러야 지급
  auto-claim-rewards: true

  # 인벤토리가 꽉 차서 보상을 받지 못할 때 최대 대기 시간 (초)
  # 0이면 무제한 대기, 양수면 해당 시간이 지나면 보상을 포기 처리한다.
  reward-pending-timeout: 0

# ============================================
# 도감 보상 설정
# ============================================
rewards:
  # 1. 최초 등록 보상: 물고기를 도감에 처음 등록했을 때 지급 (1회)
  first-register:
    # 예시:
    # cod:
    #   - "give {player} exp 10"
    #   - "give {player} bread 1"

  # 2. 마일스톤 보상: 물고기별 특정 등록 개수 달성 시 지급
  milestones:
    # 예시:
    # cod:
    #   5:
    #     - "give {player} exp 50"
    #   10:
    #     - "give {player} diamond 1"
    #     - "broadcast {player}님이 생대구 도감을 퍼펙트 완성했습니다!"

  # 3. 등급 올등록 보상: 해당 등급의 모든 물고기를 1개 이상 등록했을 때 지급
  grade-all-registered:
    F:
      - "give {player} exp 500"
      - "broadcast {player}님이 F등급 도감을 올등록했습니다!"
    E:
      - "give {player} exp 1000"
    D:
      - "give {player} exp 3000"
    C:
      - "give {player} exp 10000"
    B:
      - "give {player} exp 50000"
    A:
      - "give {player} exp 100000"
    S:
      - "give {player} exp 500000"
      - "broadcast {player}님이 S등급 도감을 올등록했습니다!"

  # 4. 등급 퍼펙트 보상: 해당 등급의 모든 물고기를 최대 슬롯까지 등록했을 때 지급
  grade-all-perfect:
    F:
      - "give {player} exp 5000"
      - "give {player} diamond 10"
      - "broadcast {player}님이 F등급 도감을 퍼펙트 완성했습니다!"
    E:
      - "give {player} exp 10000"
      - "give {player} diamond 20"
    D:
      - "give {player} exp 30000"
      - "give {player} diamond 50"
    C:
      - "give {player} exp 100000"
      - "give {player} nether_star 1"
    B:
      - "give {player} exp 500000"
      - "give {player} beacon 1"
    A:
      - "give {player} exp 1000000"
      - "give {player} command_block 1"
    S:
      - "give {player} exp 5000000"
      - "give {player} dragon_egg 1"
      - "broadcast {player}님이 S등급 도감을 퍼펙트 완성했습니다!"

  # 5. 전체 완성 보상: 모든 물고기를 퍼펙트로 등록했을 때 지급
  full-completion:
    - "give {player} exp 10000000"
    - "give {player} nether_star 10"
    - "give {player} dragon_egg 1"
    - "broadcast {player}님이 낚시 도감을 완전히 완성했습니다!"

# ============================================
# 랭킹(Ranking) 설정
# ============================================
rankings:
  # 랭킹 기능 활성화 여부
  enabled: true

  # 랭킹 업데이트 방식
  # - "periodic": 주기적으로 전체 랭킹을 재계산
  # - "realtime":  이벤트 발생 시 큐에 넣어 실시간 처리
  update-mode: "periodic"

  # periodic 모드에서의 업데이트 주기 (초)
  # 기준: 100명 서버 = 300초(5분)
  # 참고 주석 (인원수에 따른 추천값):
  #   50명  서버 → 150초 (2분 30초)
  #   100명 서버 → 300초 (5분)     ← 기본값
  #   200명 서버 → 600초 (10분)
  #   500명 서버 → 900초 (15분)
  update-interval-seconds: 300

  # realtime 모드에서 한 번에 처리할 큐 항목 수
  # 기준: 100명 서버 = 10개
  queue-batch-size: 10

  # 랭킹 GUI/명령어에서 표시할 상위 인원 수
  display-count: 10

# ============================================
# 트로피(Trophy) 설정
# ============================================
trophies:
  # 트로피 기능 활성화 여부
  enabled: true

  # 일반 트로피 기준: avg-size × multiplier 이상 낚을 시 획득
  trophy-threshold: 1.5

  # 레어 트로피 기준: max-size × multiplier 이상 낚을 시 획득
  rare-trophy-threshold: 0.9

  # 보상 (물고기별 1회만 지급)
  rewards:
    trophy:
      - "give {player} gold_ingot 5"
    rare-trophy:
      - "give {player} diamond 3"
      - "broadcast {player}님이 {fish} 레어 트로피를 달성했습니다! ({size}cm)"
