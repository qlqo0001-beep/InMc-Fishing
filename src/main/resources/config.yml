# ============================================================
#  InMc-Fishing 메인 설정 파일
#  항목이 많은 시스템은 별도 파일로 분리되어 있습니다:
#    - trophy-fight  → fight.yml
#    - 피로도        → fatigue.yml  (물약 정의는 items/potions.yml)
#    - 모든 메시지   → messages.yml
#    - 등급/물고기/낚싯대 → grades.yml / items/*-grade.yml / items/rod.yml
#    - 도감/대회/수치 보정 → collections.yml / tournaments.yml / modifiers.yml / worldguard.yml
#  이 파일에는 항목 수가 적은 핵심 설정만 남깁니다.
# ============================================================
config-version: 1

# ============================================================
#  [settings] 플러그인 기본 설정
# ============================================================
settings:
  # 플러그인을 켜고 끕니다. false로 설정하면 낚시 미니게임이
  # 비활성화되고 일반 바닐라 낚시로 동작합니다.
  enabled: true

  # 낚시 미니게임이 작동할 월드 목록입니다.
  # 여기에 없는 월드에서는 일반 바닐라 낚시로 동작합니다.
  allowed-worlds:
    - world

  # true: 낚시 시작 전 인벤토리에 빈 칸이 있어야 낚시할 수 있습니다.
  # false: 빈 칸이 없어도 낚시는 가능하지만, 아이템이 드롭됩니다.
  #        (아래 drop-overflow-items 설정 참고)
  require-empty-slot: true

  # require-empty-slot이 false일 때, 인벤토리가 가득 차면
  # true: 남은 아이템을 바닥에 드롭합니다.
  # false: 아이템이 증발합니다 (권장하지 않음).
  drop-overflow-items: true

  # 개발자 디버그 모드입니다. true로 설정하면 콘솔에 상세 로그가 출력됩니다.
  # 문제 해결이 필요할 때만 켜주세요.
  debug: false

  # rod.yml에 등록되지 않은 일반 바닐라 낚싯대(이름 없는 낚싯대)로도
  # true: 낚시를 허용합니다 (보너스 없이 기본 확률로 낚시 가능).
  # false: 낚시를 차단하고 "등록되지 않은 낚싯대" 메시지를 출력합니다.
  allow-unregistered-vanilla-rod: true

  # 낚시 실패 후 재시도 대기 시간(초)입니다.
  # 0으로 설정하면 대기 시간 없이 즉시 다시 낚시할 수 있습니다.
  retry-cooldown-seconds: 0

# ============================================================
#  [minigame-off] 미니게임 OFF 모드 설정
#  플레이어가 /fishing minigame off 로 L/R 클릭 미니게임을 끌 수 있습니다.
#  OFF 상태에서는 입질 후 등급별 대기 시간이 지나면 자동으로 낚습니다.
#  (피로도 시스템은 fatigue.yml 참고)
# ============================================================
minigame-off:
  # 플레이어가 개인적으로 미니게임 ON/OFF를 전환할 수 있는지
  allow-player-toggle: true

  # 미니게임 OFF 시 등급별 자동 낚시 대기 시간 (초, 입질 직후부터)
  catch-delay-seconds:
    f: 5
    e: 10
    d: 20
    c: 40
    b: 60
    a: 120
    s: 300

  # 미니게임 OFF 시 낚을 수 있는 등급 목록 (소문자 id)
  # 비어 있으면 모든 등급 허용
  allowed-grades:
    - f
    - e
    - d
    - c
    - b

# ============================================================
#  [cast-status] 찌를 던졌을 때 액션바 상태 표시 설정
#  표시 텍스트(ready/unregistered-rod 등)는 messages.yml의 cast-status 그룹에서 설정.
#  {rod} = 인식된 낚싯대 이름
# ============================================================
cast-status:
  enabled: true
  # 찌가 물에 있는 동안 액션바를 갱신하는 주기(틱). 20 = 1초
  refresh-interval-ticks: 20

# ============================================================
#  [net] 어망(Net) 시스템 설정
#  낚시로 잡은 물고기를 보관하는 별도 저장 공간입니다.
# ============================================================
net:
  # 어망 최대 보관 가능 마릿수
  # 낚시 성공 시 물고기가 어망에 자동 저장됩니다.
  # 어망이 꽉 차면 기존처럼 인벤토리로 지급됩니다.
  max-size: 100

# ============================================================
#  [fillet] 생선 살 가공 시스템 설정
#  물고기를 생선 살로 가공할 때의 산출량과 소요 시간을 조정합니다.
# ============================================================
fillet:
  # 기본 산출량 (공식: round(기준값 × (등급 최대weight / 해당 fish weight)))
  base-yield: 3

  # 기본 가공 슬롯 수
  default-slots: 3

  # true=동시 작업, false=순차 작업
  concurrent-mode: true

  # 등급별 기본 가공 시간(초)
  grade-times:
    f: 10
    e: 20
    d: 40
    c: 60
    b: 90
    a: 120
    s: 180

  # 트로피/레어트로피 배율 (가공 시간에 곱함)
  trophy-multiplier: 1.5
  rare-trophy-multiplier: 2.0

  # 희귀도 계수 사용 여부 (true=희귀할수록 가공 시간 증가)
  use-rarity-factor: true

  # 슬롯에 투입된 물고기 1마리당 추가되는 가공 시간(초)
  time-per-item: 5

# ============================================================
#  [sounds] 효과음 설정
#  각 상황에 재생될 소리를 지정합니다.
#  사용 가능한 소리는 https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
#  소리를 끄려면 빈 문자열("")로 설정하세요.
# ============================================================
sounds:
  # 물고기가 찌를 물었을 때(입질) 나는 소리 — 미니게임이 시작되는 순간
  bite: entity.experience_orb.pickup

  # 미니게임 중 L/R 버튼을 올바르게 클릭했을 때 나는 소리
  control: entity.egg.throw

  # 미니게임 성공(물고기 낚음) 시 나는 소리
  success: entity.player.levelup

  # 미니게임 실패 시 나는 소리
  fail: entity.item.break

  # 더블 보상(아이템 2개) 획득 시 나는 추가 소리
  double: entity.experience_orb.pickup

  # 대어(Big Fish)를 낚았을 때 나는 소리
  big-fish: entity.firework_rocket.twinkle

# ============================================================
#  [rates] 확률 설정
#  낚시 시스템의 각종 확률을 조정합니다.
# ============================================================
rates:
  # 더블 보상 확률 (%) — 낚시 성공 시 아이템이 2개 지급될 확률. 예: 7.0 = 7%
  double-chance: 7.0

  # 대어(Big Fish) 승급 확률 (%) — 낚시 성공 시 한 단계 높은 등급의 아이템이 낚일 확률.
  #   예: F등급 → E등급, A등급 → S등급. S등급은 다음 등급이 없으므로 승급이 발생하지 않습니다.
  big-fish-chance: 1.0
