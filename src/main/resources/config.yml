# ============================================================
#  InMc-Fishing 설정 파일
#  처음 사용하는 분들도 쉽게 설정할 수 있도록 모든 항목에
#  상세 설명을 추가했습니다.
# ============================================================
config-version: 1

# ============================================================
#  [settings] 플러그인 기본 설정
# ============================================================
settings:
  # 플러그인을 켜고 끕니다. false로 설정하면 낚시 미니게임이
  # 비활성화되고 일반 바닐라 낚시로 동작합니다.
  enabled: true

  # 낚시 미니게임이 작동할 월드 목록입니다.
  # 여기에 없는 월드에서는 일반 바닐라 낚시로 동작합니다.
  allowed-worlds:
    - world

  # true: 낚시 시작 전 인벤토리에 빈 칸이 있어야 낚시할 수 있습니다.
  # false: 빈 칸이 없어도 낚시는 가능하지만, 아이템이 드롭됩니다.
  #        (아래 drop-overflow-items 설정 참고)
  require-empty-slot: true

  # require-empty-slot이 false일 때, 인벤토리가 가득 차면
  # true: 남은 아이템을 바닥에 드롭합니다.
  # false: 아이템이 증발합니다 (권장하지 않음).
  drop-overflow-items: true

  # 개발자 디버그 모드입니다.
  # true로 설정하면 콘솔에 상세 로그가 출력됩니다.
  # 문제 해결이 필요할 때만 켜주세요.
  debug: false

  # rod.yml에 등록되지 않은 일반 바닐라 낚싯대(이름 없는 낚싯대)로도
  # true: 낚시를 허용합니다 (보너스 없이 기본 확률로 낚시 가능).
  # false: 낚시를 차단하고 "등록되지 않은 낚싯대" 메시지를 출력합니다.
  allow-unregistered-vanilla-rod: true

  # 낚시 실패 후 재시도 대기 시간(초)입니다.
  # 0으로 설정하면 대기 시간 없이 즉시 다시 낚시할 수 있습니다.
  retry-cooldown-seconds: 0

# ============================================================
#  [minigame-off] 미니게임 OFF 모드 설정
#  플레이어가 /fishing minigame off 로 L/R 클릭 미니게임을 끌 수 있습니다.
#  OFF 상태에서는 입질 후 등급별 대기 시간이 지나면 자동으로 낚습니다.
# ============================================================
minigame-off:
  # 플레이어가 개인적으로 미니게임 ON/OFF를 전환할 수 있는지
  allow-player-toggle: true

  # 미니게임 OFF 시 등급별 자동 낚시 대기 시간 (초, 입질 직후부터)
  catch-delay-seconds:
    f: 5
    e: 10
    d: 20
    c: 40
    b: 60
    a: 120
    s: 300

  # 미니게임 OFF 시 낚을 수 있는 등급 목록 (소문자 id)
  # 비어 있으면 모든 등급 허용
  allowed-grades:
    - f
    - e
    - d
    - c
    - b

# ============================================================
#  [cast-status] 찌를 던졌을 때 액션바 상태 표시
#  {rod} = 인식된 낚싯대 이름
# ============================================================
cast-status:
  enabled: true
  # 찌가 물에 있는 동안 액션바를 갱신하는 주기(틱). 20 = 1초
  refresh-interval-ticks: 20
  ready: "&a물고기를 기다리는 중~ &f{rod}| &b피로도 {fatigue}"
  unregistered-rod: "&c등록되지 않은 낚싯대"
  wrong-world: "&c이 월드에서는 낚시 불가"
  plugin-disabled: "&c낚시 플러그인 비활성"
  no-empty-slot: "&c인벤토리 빈칸이 필요합니다"
  minigame-off: "&f자동 낚시 모드 &8| &b피로도 {fatigue}"

# ============================================================
#  [auto-catch] 미니게임 OFF 자동 낚시 중 액션바
#  {time} = 남은 초, {grade} = 등급, {fish} = 물고기 이름, {fatigue} = 현재 피로도
# ============================================================
auto-catch:
  actionbar-format: "&e{time} 초 &7후 낚음... &f[{grade}] &7{fish} &8| &b피로도 {fatigue}"

# ============================================================
#  [fatigue] 자동 낚시(미니게임 OFF) 전용 피로도 시스템
#  일반 L/R 클릭 미니게임 낚시에는 전혀 영향을 주지 않습니다.
#  장시간(예: 밤새) 방치성 자동 낚시를 제한하기 위한 설정입니다.
# ============================================================
fatigue:
  # 플레이어의 기본 최대 피로도입니다.
  # 자연 회복은 기본적으로 이 수치까지만 회복됩니다.
  # (낚싯대 옵션으로 최대 피로도가 증가하면 증가된 수치까지 자연 회복됩니다.)
  default: 2000

  # 플레이어가 가질 수 있는 절대 최대 피로도입니다.
  # 자연 회복으로는 도달할 수 없으며,
  # 피로도 회복 물약, 관리자 명령어 등의 수동 회복만 이 수치까지 회복할 수 있습니다.
  max: 20000

  # 자연 회복 설정입니다.
  recovery:
    # 회복 주기(interval)마다 자동으로 회복되는 기본 피로도량입니다.
    amount: 100
    # 자연 회복 주기(초 단위)입니다. 기본값 300 = 5분마다 회복됩니다.
    interval: 300

  # 피로도가 이 값 "이하"로 내려가면 미니게임이 자동으로 강제 ON되고,
  # 플레이어는 /fishing minigame off 로 다시 끌 수 없습니다 (자동 낚시 잠금).
  auto-minigame-lock-threshold: 0

  # 잠긴 상태에서 피로도가 이 값 "이상"으로 회복되면 다시 미니게임 OFF(자동 낚시)가 가능해집니다.
  auto-minigame-unlock-threshold: 100

  # 자동 낚시(미니게임 OFF) 성공 시 낚은 물고기 등급에 따라 차감되는 피로도량입니다.
  # 일반 미니게임(ON) 낚시에는 적용되지 않습니다.
  consume:
    f: 10
    e: 50
    d: 100
    c: 200
    b: 400
    a: 800
    s: 1600

  # 등급별 피로도 회복 물약 설정입니다.
  # /fishing give potion <플레이어> <등급> [개수] 로 지급할 수 있습니다.
  # 손에 들고 우클릭하면 1개를 소모해 amount만큼 즉시 회복합니다.
  # DECISION-NEEDED: 실제로 "마시는" 바닐라 연출 없이 우클릭 즉시 소모 방식으로 구현했습니다.
  # 마시는 애니메이션이 필요하면 PlayerItemConsumeEvent 기반으로 바꿔야 합니다 (PROGRESS.md 참고).
  potions:
    f:
      amount: 200
      material: POTION
      name: "&f[F] 피로회복 물약"
      lore:
        - "&7피로도를 &f200 &7회복합니다."
    e:
      amount: 500
      material: POTION
      name: "&a[E] 피로회복 물약"
      lore:
        - "&7피로도를 &a500 &7회복합니다."
    d:
      amount: 1000
      material: POTION
      name: "&b[D] 피로회복 물약"
      lore:
        - "&7피로도를 &b1000 &7회복합니다."
    c:
      amount: 2000
      material: POTION
      name: "&9[C] 피로회복 물약"
      lore:
        - "&7피로도를 &92000 &7회복합니다."
    b:
      amount: 4000
      material: POTION
      name: "&5[B] 피로회복 물약"
      lore:
        - "&7피로도를 &54000 &7회복합니다."
    a:
      amount: 8000
      material: POTION
      name: "&6[A] 피로회복 물약"
      lore:
        - "&7피로도를 &68000 &7회복합니다."
    s:
      amount: 16000
      material: POTION
      name: "&c[S] 피로회복 물약"
      lore:
        - "&7피로도를 &c16000 &7회복합니다."

# ============================================================
#  [net] 어망(Net) 시스템 설정
#  낚시로 잡은 물고기를 보관하는 별도 저장 공간입니다.
#  인벤토리(9x4)의 공간 부족 문제를 해결합니다.
# ============================================================
net:
  # 어망 최대 보관 가능 마릿수
  # 낚시 성공 시 물고기가 어망에 자동 저장됩니다.
  # 어망이 꽉 차면 기존처럼 인벤토리로 지급됩니다.
  max-size: 100

# ============================================================
#  [sounds] 효과음 설정
#  각 상황에 재생될 소리를 지정합니다.
#  사용 가능한 소리는 https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
#   에서 확인할 수 있습니다.
#  소리를 끄려면 빈 문자열("")로 설정하세요.
# ============================================================
sounds:
  # 물고기가 찌를 물었을 때(입질) 나는 소리 — 미니게임이 시작되는 순간
  bite: entity.experience_orb.pickup

  # 미니게임 중 L/R 버튼을 올바르게 클릭했을 때 나는 소리
  control: entity.egg.throw

  # 미니게임 성공(물고기 낚음) 시 나는 소리
  success: entity.player.levelup

  # 미니게임 실패 시 나는 소리
  fail: entity.item.break

  # 더블 보상(아이템 2개) 획득 시 나는 추가 소리
  double: entity.experience_orb.pickup

  # 대어(Big Fish)를 낚았을 때 나는 소리
  big-fish: entity.firework_rocket.twinkle

# ============================================================
#  [rates] 확률 설정
#  낚시 시스템의 각종 확률을 조정합니다.
# ============================================================
rates:
  # 더블 보상 확률 (%)
  # 낚시 성공 시 아이템이 2개 지급될 확률입니다.
  #   예: 7.0 = 7%
  double-chance: 7.0

  # 대어(Big Fish) 승급 확률 (%)
  # 낚시 성공 시 한 단계 높은 등급의 아이템이 낚일 확률입니다.
  #   예: F등급 → E등급, A등급 → S등급
  #   S등급은 다음 등급이 없으므로 승급이 발생하지 않습니다.
  big-fish-chance: 1.0

# ============================================================
#  [storage] 데이터 저장 설정
# ============================================================
storage:
  # 낚시 대회 기록 보관 기간 (일)
  # 이 기간이 지난 기록은 자동으로 삭제됩니다.
  tournament-history-retention-days: 90

  # 사용하지 않는 도감 데이터 자동 정리
  # true: 일정 기간 접속하지 않은 플레이어의 도감 데이터를 삭제합니다.
  inactive-collection-cleanup: false

# ============================================================
#  [messages] 채팅 메시지 설정
#  {prefix} - messages.prefix 값으로 자동 치환
#  {item}   - 낚은 아이템의 이름
#  {grade}  - 아이템의 등급 (F/E/D/C/B/A/S)
#  {player} - 플레이어 이름
#
#  색상 코드: &0(검정) &1(진파랑) &2(초록) &3(청록)
#             &4(빨강) &5(보라) &6(금색) &7(회색)
#             &8(진회색) &9(파랑) &a(연두) &b(하늘)
#             &c(주황) &d(분홍) &e(노랑) &f(흰색)
#             &l(굵게) &n(밑줄) &o(기울임) &m(취소선)
# ============================================================
messages:
  # 모든 메시지 앞에 자동으로 붙는 접두사입니다.
  prefix: "&f[ &b낚시&f ]"

  # 낚시 성공 일반 메시지
  caught: "{prefix} 축하합니다! {item}&f를(을) 낚았습니다!"

  # 더블 보상 성공 메시지 (아이템 2개)
  caught-double: "{prefix} 축하합니다! {item}&f를(을) 2마리 낚았습니다!"

  # 대어(Big Fish) 낚시 성공 메시지
  big-fish: "&b대어를 낚았습니다!"

  # 미니게임 실패 메시지
  fail: "&f물고기가 도망갔네.."

  # 인벤토리가 가득 찼을 때 메시지
  no-empty-slot: "&c인벤토리에 빈칸이 없습니다!"

  # 보상 지급 실패 시 메시지 (관리자 설정 오류 등)
  no-rewards: "{prefix} 아무것도 낚이지 않았네요. 관리자에게 문의하세요. ({grade})"

  # 미등록 낚싯대 사용 시 메시지
  unregistered-rod: "&c등록되지 않은 낚싯대입니다. 관리자에게 문의하세요."

  # 미니게임 ON/OFF 전환 메시지
  minigame-on: "{prefix} &a미니게임이 &f켜졌습니다&a. L/R 클릭 미니게임으로 낚습니다."
  minigame-off: "{prefix} &e미니게임이 &f꺼졌습니다&e. 입질 후 자동으로 낚습니다."
  minigame-toggle-disabled: "&c미니게임 ON/OFF 전환 기능이 비활성화되어 있습니다."

  # 피로도가 바닥나 자동 낚시(미니게임 OFF)가 강제로 잠겼을 때 메시지
  fatigue-locked: "{prefix} &c피로도가 바닥나 자동 낚시가 잠겼습니다! 미니게임으로만 낚시할 수 있습니다."
  # 피로도가 회복되어 다시 자동 낚시를 사용할 수 있게 됐을 때 메시지
  fatigue-unlocked: "{prefix} &a피로도가 회복되어 다시 자동 낚시를 사용할 수 있습니다."
  # 피로도 회복 물약 사용 메시지 ({amount} = 회복량, {current} = 사용 후 현재 피로도)
  fatigue-potion-used: "{prefix} &b피로도를 {amount} 회복했습니다. (현재: {current})"

# ============================================================
#  [titles] 타이틀/액션바 화면 설정
#  {grade}    - 등급 (F/E/D/C/B/A/S)
#  {sequence} - 현재까지의 R/L 시퀀스 표시
#  {time}     - 남은 시간 (초)
#  {bar}      - 진행 바 (|||||||| 형태)
#  {prefix}   - messages.prefix 값
# ============================================================
titles:
  # 미니게임 시작 시 상단에 표시될 큰 타이틀
  # 예) "[ F ] 등급"
  start-title: "&f[ &a{grade}&f ] 등급"

  # 미니게임 시작 시 타이틀 아래에 표시될 작은 글씨
  # R/L 시퀀스가 표시됩니다
  start-subtitle: "{sequence}"

  # 미니게임 성공 시 표시될 타이틀
  success-title: "&f잡았다!"

  # 미니게임 실패 시 표시될 타이틀
  fail-title: "&f물고기가 도망갔네.."

  # 시간 초과로 실패 시 표시될 타이틀
  timeout-title: "&f물고기가 도망갔네.."

  # 미니게임 실패/타임아웃 시 타이틀 아래 표시될 작은 글씨
  fail-subtitle: "&cL : 좌클릭 R : 우클릭"

  # 인벤토리가 가득 차서 낚시를 시작할 수 없을 때 표시될 타이틀
  inventory-full-title: "&cFail"

  # 인벤토리가 가득 찼을 때 타이틀 아래 표시될 작은 글씨
  inventory-full-subtitle: "&f인벤토리에 빈칸이 없습니다!"

  # 미니게임 진행 중 하단 액션바에 표시될 진행 바 형식
  # {bar}는 실제 진행 바(||||)로, {time}은 남은 시간(초)으로 치환됩니다
  actionbar-format: "&f{bar} &e{time}s &7{sequence}"

  # 진행 바에 사용될 문자
  #  | (막대) 대신 ■, █, ● 등 원하는 문자로 변경 가능
  progress-bar-char: "|"

  # 진행이 완료된 부분의 색상 (남은 시간)
  progress-bar-filled-color: "&a"

  # 아직 진행되지 않은 부분의 색상 (소모된 시간)
  progress-bar-empty-color: "&7"

  # 시퀀스에서 이미 완료된(성공한) 클릭의 색상
  completed-color: "&a"

  # 현재 입력해야 할 클릭의 색상 (강조)
  current-color: "&e"

  # 아직 입력하지 않은 남은 클릭의 색상
  pending-color: "&7"

  # 성공 시 서브타이틀 (완료된 시퀀스 표시)
  # 빈 문자열("")로 설정하면 서브타이틀이 표시되지 않습니다
  success-subtitle: "&a{sequence}"

  # 성공/실패/타임아웃 타이틀이 표시될 시간 (초)
  title-display-seconds: 2.0
  title-fade-in: 0.5
  title-fade-out: 0.5

# ============================================================
#  [display] R/L 표시 설정
#  미니게임 화면에 나타나는 클릭 버튼의 모양과 색상을
#  자유롭게 변경할 수 있습니다.
# ============================================================
display:
  # 좌클릭(L)을 표시할 문자와 색상
  # 예: "&l&fL" = 흰색 굵은 L
  #     "&a◀"  = 초록색 ◀ (화살표로 변경 가능)
  left-click-text: "&l&fL"

  # 우클릭(R)을 표시할 문자와 색상
  # 예: "&l&fR" = 흰색 굵은 R
  #     "&6▶"  = 금색 ▶ (화살표로 변경 가능)
  right-click-text: "&l&fR"

  # 이미 성공적으로 입력한(완료된) R/L의 색상
  completed-color: "&8"

  # 현재 입력해야 할 R/L의 색상 (강조)
  current-color: "&6&l"

  # 아직 입력하지 않은 남은 R/L의 색상
  pending-color: "&f"

  # 시퀀스가 성공적으로 완료되었을 때의 R/L 색상
  success-color: "&a"

  # 잘못 입력했을 때(실패)의 R/L 색상
  fail-color: "&c"

# ============================================================
#  [trophy-fight] Trophy Fight 시스템 설정
#  트로피/레어 트로피 물고기를 낚았을 때 추가로 진행하는
#  힘겨루기(Fight) 시스템입니다.
#  일반 물고기는 기존 미니게임 성공 후 즉시 획득하지만,
#  트로피 물고기는 추가 Fight를 성공해야만 최종 획득됩니다.
# ============================================================
trophy-fight:
  # Trophy Fight 시스템 활성화 여부
  enabled: true

  # Fight 제한 시간 (초). 0 = 제한 없음.
  # 단, Fish Stamina가 0이 되면 이 카운트다운은 일시 정지됩니다.
  max-time-seconds: 120

  # 파티클 출력 인터벌 (틱). 기본값 2 = 0.1초마다.
  # 핵심 수치 계산은 매 틱 수행되지만, 파티클은 이 주기마다 출력됩니다.
  particle-interval: 2

  # --- AI 설정 ---
  # Fish AI 상태 기계 설정 (Phase 2에서 구체화)
  ai:
    # AI 업데이트 주기 (틱). 20 = 매 틱.
    update-tick: 20

  # --- HUD 설정 ---
  # BossBar와 ActionBar 표시 설정 (Phase 3에서 구현)
  hud:
    # BossBar 게이지 색상 (Tension 위험도 표시)
    bar-color-safe: "&a"       # 안정 (초록)
    bar-color-warning: "&e"    # 주의 (노랑)
    bar-color-danger: "&c"     # 위험 (빨강)
    # BossBar 네임 텍스트 ({distance} = 현재 Distance 값)
    bossbar-title-format: "Distance: {distance}"
    # ActionBar 텍스트 ({stamina}/{power}/{resistance}/{reel} = 각 수치)
    actionbar-format: "Stamina {stamina}% | Power {power} | Resistance {resistance} | Reel {reel}%"

  # --- 사운드 설정 ---
  # Fight 중 상황별 사운드 (Phase 3에서 구현)
  # 빈 문자열("") = 해당 상황 사운드 끄기
  sound:
    # 사운드 출력 인터벌 (틱). 기본값 2.
    interval: 2
    charge: ""              # 강한 돌진
    reel-overload: ""       # 릴 과부하
    tension-danger: ""     # 장력 위험
    fish-exhausted: ""     # 물고기 지침
    success: ""            # 회수 성공

  # --- 스탯 설정 ---
  # Fight 핵심 스탯 기본값 (Phase 2에서 구체화)
  stats:
    # 물고기 스탯 기본값
    default-stamina: 100.0
    default-power: 50.0
    default-resistance: 50.0
    # Distance 기본값 (플레이어와 물고기 사이 거리)
    default-distance: 100.0
    # Tension 최대값 (이 값에 도달하면 줄이 끊어짐)
    max-tension: 100.0
    # Reel State 기본값 (릴 내구도)
    default-reel-state: 100.0

    # 등급별 난이도 차등 배수 (1.0 = 기본, 높을수록 어려움)
    # Rare Trophy는 기본 배수에 추가로 더 어려움 (Phase 2에서 적용)
    grade-difficulty:
      f: 0.5
      e: 0.7
      d: 1.0
      c: 1.3
      b: 1.6
      a: 2.0
      s: 2.5
