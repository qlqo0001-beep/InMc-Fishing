# ─────────────────────────────────────────────────────────────
# 낚시 HUD (ItemsAdder 글리프)
#
# 좌표는 전부 GUI 픽셀이고 x 는 "화면 가로 중앙 = 0" 기준이다.
# 세로 위치는 리소스팩 글리프에 박혀 있으므로(= PNG 아래 투명 패딩)
# 세로를 옮기려면 tools/hud_spec.py 의 Y 값을 고치고 빌드 스크립트를 다시 돌려야 한다.
# ─────────────────────────────────────────────────────────────
enabled: true

# ItemsAdder 콘텐츠 네임스페이스 (contents/fishing_hud)
namespace: fishing_hud

# 리소스팩을 실제로 받은 플레이어에게만 글리프 HUD 를 쓴다.
# false 로 두면 팩 적용 여부를 확인하지 않고 항상 글리프 HUD 를 사용한다.
require-resourcepack: true

# HUD 갱신 주기(틱). 파이트는 매 틱 계산되지만 전송은 이 주기로 묶는다.
update-interval-ticks: 2

# ── 화면별 표시 방식 ────────────────────────────────────────
#   glyph    : ItemsAdder 글리프 HUD.
#              ItemsAdder 가 없거나 플레이어가 리소스팩을 못 받았으면
#              자동으로 아래 vanilla 와 같게 동작합니다.
#   vanilla  : 글리프 HUD 를 쓰지 않고 플러그인 기존 표시를 그대로 사용합니다.
#              파이트는 fight.yml 의 보스바/액션바/타이틀 설정이 그대로 적용되고,
#              미니게임은 기존 타임바 표시가 나옵니다.
#   fallback : vanilla 와 같습니다(옛 이름). 새로 설정할 때는 vanilla 를 쓰세요.
fight:
  mode: glyph
minigame:
  mode: glyph          # L/R 클릭 미니게임만 예전 방식으로 되돌리려면 vanilla

# ItemsAdder 오프셋 글리프로 만들 수 있는 이동량(px). 큰 값부터 적어야 한다.
offset-magnitudes: [256, 128, 64, 32, 16, 8, 4, 2, 1]

# 경고 연출
warning:
  tension-threshold: 0.8      # 이 비율 이상이면 경고 문구로 교체
  blink-period-ticks: 10      # 점멸 주기 (절반은 숨김)

# 콤보 색 (좌클릭 = 릴 감기 / 우클릭 = 릴 풀기)
combo:
  left-color: gold
  right-color: cyan

colors:
  cream: "#E8F4FF"
  gold: "#FFD166"
  orange: "#FF9F43"
  cyan: "#7EE8FA"
  green: "#57D95C"
  yellow: "#FFD44F"
  red: "#FF5C5C"
  blue: "#8ECBFF"
  grey: "#96A8BA"
  white: "#FFFFFF"

layout:
  track:
    x: -100                   # 트래커 패널 왼쪽 끝 (폭 200)
    danger-x: 54              # 위험 구간 표시 시작 x
    angler-x: -94             # 낚시꾼 아이콘
    fish-start: -86           # 물고기 마커가 움직이는 구간
    fish-span: 168
  card:
    x: -88                    # 카드 왼쪽 끝 (폭 176)
    icon-dx: 10               # 카드 왼쪽 끝 기준 상대 좌표
    title-dx: 30
    seconds-dx: 166           # 오른쪽 정렬 기준
    timer-dx: 14
    timer-fill-dx: 15
    timer-width: 146
    guide-icon-dx: 14
    guide-text-dx: 30
  combo:
    x: 100                    # 콤보는 카드 오른쪽, 이 x 를 왼쪽 끝으로 정렬
  gauges:
    hp-x: -134                # 각 트랙 왼쪽 끝 (게이지 트랙 폭 68 / 텐션 100)
    tension-x: -50
    reel-x: 66
    bar-width: 64             # 트랙 안쪽 채움 폭
    tension-width: 96
    tension-safe-percent: 55  # 텐션 게이지: 여기까지 초록
    tension-warn-percent: 78  # 여기까지 노랑, 그 위는 빨강 (채워진 만큼만 색이 보인다)
    label-dx: 11
    value-dx: 68              # 오른쪽 정렬 기준(트랙 왼쪽 끝 기준 상대)
  minigame:
    key-gap: 6                # 키 카드(28x36) 사이 간격
    panel-padding: 12         # 패널 좌우 여백 — 클릭 수에 따라 패널 폭이 자동으로 늘어난다
    panel-min-width: 150
    timer-x: -60
    timer-fill-x: -59
    timer-width: 118

# FishState -> 카드 표시. sprite/guide 는 리소스팩 글리프 이름, color 는 위 colors 키.
# button: left = 좌클릭 안내 아이콘, right = 우클릭 안내 아이콘
states:
  REST:            {sprite: rest,            icon: rest,      color: gold,   button: left}
  SLOW_MOVE:       {sprite: slow_move,       icon: slow,      color: gold,   button: left}
  NORMAL_MOVE:     {sprite: normal_move,     icon: normal,    color: cream,  button: left}
  TURN:            {sprite: turn,            icon: turn,      color: cyan,   button: left}
  CIRCLE:          {sprite: circle,          icon: circle,    color: cyan,   button: left}
  CHARGE:          {sprite: charge,          icon: charge,    color: orange, button: right}
  DIVE:            {sprite: dive,            icon: dive,      color: orange, button: right}
  FINAL_STRUGGLE:  {sprite: final_struggle,  icon: final,     color: red,    button: right}
  EXHAUSTED:       {sprite: exhausted,       icon: exhausted, color: green,  button: left}
  JUMP:            {sprite: jump,            icon: jump,      color: cyan,   button: left}
  LINE_TANGLE:     {sprite: line_tangle,     icon: tangle,    color: red,    button: right}

# ItemsAdder 가 없거나 리소스팩을 못 받은 플레이어용 폴백(보스바 + 액션바 + 타이틀)
fallback:
  enabled: true
  bossbar-title: "거리 {distance} / {max_distance} M"
  actionbar: "물고기 체력 {stamina}%  |  릴 {reel}%  |  텐션 {tension}%"
