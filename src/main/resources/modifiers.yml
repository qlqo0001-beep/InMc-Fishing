# ============================================================
#  Modifier (확률 조정) 설정 파일
#  각종 환경 조건에 따라 등급별 확률을 조정합니다.
#  모든 Modifier는 곱연산으로 적용됩니다.
#  (예: 2.0이면 해당 등급이 나올 확률이 2배)
# ============================================================
#
# 각 조건 아래 grade-weight-multiplier에서
# 등급별 배수를 설정할 수 있습니다.
#   1.0 = 변동 없음 (기본)
#   2.0 = 2배 확률
#   0.5 = 절반 확률
#   0.0 = 해당 등급이 절대 나오지 않음
#
# 설정하지 않은 등급은 자동으로 1.0 (변동 없음)으로 처리됩니다.
#
# 사용 예시:
#   특정 월드에서 S등급 확률을 높이고 싶다면:
#   world.내월드이름.grade-weight-multiplier.S: 2.0
#
#   비 오는 날 모든 등급 확률을 높이고 싶다면:
#   weather.RAIN.grade-weight-multiplier: {S: 1.5, A: 1.5, ...}
# ============================================================

# 월드별 확률 조정
# 키: 월드 이름 (Bukkit 월드 이름과 정확히 일치해야 함)
# 값: grade-weight-multiplier
world:
  # 예시: 네더 월드에서 S/A등급 확률 증가
  world_nether:
    grade-weight-multiplier:
      S: 2.0
      A: 1.5

# 바이옴(생물군계)별 확률 조정
# 키: 바이옴 이름 (대소문자 구분, Bukkit Biome.name() 값 사용)
#     주요 바이옴: OCEAN, RIVER, BEACH, FOREST, PLAINS, SWAMP, JUNGLE 등
biome:
  # 예시: 바다에서 낚시하면 F등급 확률 유지
  OCEAN:
    grade-weight-multiplier:
      F: 1.0
  # 예시: 강에서 F등급 확률 약간 증가
  RIVER:
    grade-weight-multiplier:
      F: 1.2

# 날씨별 확률 조정
# 키: CLEAR (맑음), RAIN (비), THUNDER (뇌우)
# THUNDER는 RAIN과 동일하게 처리됩니다
weather:
  # 비 오는 날 A/S등급 확률 증가
  RAIN:
    grade-weight-multiplier:
      A: 1.3
      S: 1.5
  CLEAR:
    grade-weight-multiplier: {}

# 시간대별 확률 조정
# 키: DAY (낮, 0~12000틱), NIGHT (밤, 12000~24000틱)
time:
  # 밤에 S등급 확률 약간 증가
  NIGHT:
    grade-weight-multiplier:
      S: 1.2
  DAY:
    grade-weight-multiplier: {}

# 권한(Permission)별 확률 조정
# 플레이어가 특정 권한을 가지고 있으면 해당 등급의 확률이 조정됩니다
# 여러 권한을 동시에 보유하면 모든 배수가 곱연산으로 누적됩니다
permission:
  # 예시: fishing.vip 권한이 있는 플레이어는 A/S등급 확률 1.1배
  fishing.vip:
    grade-weight-multiplier:
      A: 1.1
      S: 1.1